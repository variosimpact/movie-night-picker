<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Movie Picker</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Hello Earth!</h1>
        
        <form id="searchForm" class="case-box">
        <input type="text" id="movieSearch" placeholder="Search for a movie..." class="search-box">
        <button id="searchButton" onclick="fetchMovies()" class="buttons">Search</button>
        <button id="randomButton" onclick="fetchRandomMovie()" class="buttons">Surprise Me</button>
        </form>

        <div id="movieResults"></div>
    </body>

    <script>
        async function fetchMovies() {
            const query = document.getElementById('movieSearch').value;
            if (query.trim() === '') return;
            const resultsDiv = document.getElementById('movieResults');

            try {
                const response = await fetch(`http://www.omdbapi.com/?apikey=46bb50de&t=${query}`);
                const data = await response.json();
                
                if (data.Response === "False") {
                    resultsDiv.innerHTML = `<p>No movies found for "${query}". Please try another search.</p>`;
                    return;
                }

                const movieTitle = data.Title; // Get the title of the first movie in the search results
                const movieYear = data.Year; // Get the year of the first movie in the search results
                const moviePoster = data.Poster; // Get the poster URL of the first movie in the search results
                const movieRuntime = data.Runtime;
                const movieRating = data.Rated;
                const movieDirector = data.Director;
                const movieGenre = data.Genre;
                const moviePlot = data.Plot;
                
                let movieScore = '';
                data.Ratings.forEach(rating => {
                    movieScore += `${rating.Source}: ${rating.Value}<br>`;
                })

                resultsDiv.innerHTML = `
                <div class="movie-info" style="background-image: url(${moviePoster})">
                    <h2 class="movie-title">${movieTitle} (${movieYear})</h2>
                    <h3 class="movie-title">Rated: ${movieRating}</h3>
                    <h3 class="movie-title">Director: ${movieDirector}</h3>
                    <h3 class="movie-title">Genre: ${movieGenre}</h3>
                    <button class="plot-button" onclick="togglePlot()">Show Plot</button>
                    <h3 class="plot-section">Plot: ${moviePlot}</h3>
                    <h3 class="movie-title">${movieRuntime}</h3>
                    <li style="list-style: none; font-size: 12px;" class="movie-title">${movieScore}</li>
                </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `<p>Error fetching movies: ${error.message}</p>`;
            }
        }

        document.getElementById('searchForm').addEventListener('submit', function(event) {
            event.preventDefault(); // stops page refresh
            fetchMovies();
        });

            async function fetchRandomMovie() {
                const movieNameRandom = Math.floor(Math.random() * 7);
                const randomMovieGerne = ['action', 'comedy', 'drama', 'horror', 'sci-fi', 'romance', 'thriller'];
                const randomMovieSelect = randomMovieGerne[movieNameRandom];
                const randomJSONNumber = Math.floor(Math.random() * 9);
                const InputBoxRandom = document.getElementById('movieResults');
                const response = await fetch(`http://www.omdbapi.com/?apikey=46bb50de&s=${randomMovieSelect}`);
                const data = await response.json();

                const randomMovieTitle = data.Search[randomJSONNumber].Title;
                const randomMovieYear = data.Search[randomJSONNumber].Year;
                const randomMoviePoster = data.Search[randomJSONNumber].Poster;

                InputBoxRandom.innerHTML = `
                    <h2>${randomMovieTitle} (${randomMovieYear})</h2>
                    <img src="${randomMoviePoster}" alt="${randomMovieTitle} Poster">
                `;
            }

            async function togglePlot() {
                const plotSection = document.querySelector('.plot-section');
                const plotButton = document.querySelector('.plot-button');

                if (plotSection.style.display === 'none' || plotSection.style.display === '') {
                    plotSection.style.display = 'block';
                    plotButton.textContent = 'Hide Plot';
                } else {
                    plotSection.style.display = 'none';
                    plotButton.textContent = 'Show Plot';
                }
            }
    </script>
</html>
